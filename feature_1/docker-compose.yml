services:
  backend:
    build: ./backend
    container_name: django-backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
    - DJANGO_SETTINGS_MODULE=registration_system.settings
    - CELERY_BROKER_URL=redis://redis:6379/0      
    - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - database
    networks:
      - demo-net
 
  database:
    image: postgres:15-alpine
    container_name: django-db
    env_file:
      - .env
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - demo-net
    restart: always

  redis: # <-- NOWA USŁUGA DLA BROKERA CELERY
    image: redis:alpine
    container_name: django-redis
    networks:
      - demo-net
    restart: always
  celery_worker: # <-- NOWA USŁUGA DLA WORKERA CELERY
    build: ./backend
    container_name: django-celery-worker
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=registration_system.settings
      - CELERY_BROKER_URL=redis://redis:6379/0       # <-- DODAJ TO
      - CELERY_RESULT_BACKEND=redis://redis:6379/0   # <-- DODAJ TO
    depends_on:
      - redis # Worker zależy od brokera
      - database # Worker może zależeć od bazy danych
    networks:
      - demo-net
    command: celery -A registration_system worker -l info # <-- KLUCZOWA KOMENDA URUCHAMIAJĄCA WORKER
    restart: always
networks:
  demo-net:
volumes:
  postgres-data: