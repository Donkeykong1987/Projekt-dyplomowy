{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}System Rejestracji{% endblock %}</title>

    <!-- FullCalendar CSS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.7/main.min.css" rel="stylesheet" />

    <!-- Twój własny CSS -->
    <link rel="stylesheet" href="{% static 'system_rejestracji/calendar.css' %}">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    {% block extra_head %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-light" style="background-color: #f2f2f2; padding: 10px;">
    <ul class="d-flex list-unstyled gap-3 align-items-center m-0 p-0">
        <li><a href="{% url 'my_visits' %}" class="nav-link">Moje wizyty</a></li>
        <li><a href="{% url 'calendar' %}" class="nav-link">Kalendarz</a></li>
        <li><a href="{% url 'profile' %}" class="nav-link">Profil</a></li>
        <li class="ms-auto">
            <form action="{% url 'logout' %}" method="post" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-secondary btn-sm">Wyloguj się</button>
            </form>
        </li>
    </ul>
</nav>

<div class="container py-4">
    {% block content %}{% endblock %}
</div>

<!-- FullCalendar JS -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.7/main.min.js"></script>

<!-- Bootstrap JS Bundle (z Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

{% block extra_js %}{% endblock %}
</body>
</html>
