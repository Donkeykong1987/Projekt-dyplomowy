{% extends "system_rejestracji/base.html" %}
{% block title %}Kalendarz{% endblock %}

{% block content %}
<div class="container py-4">
    <h1 class="mb-4">Kalendarz wizyt</h1>

    <div class="d-flex justify-content-between align-items-center mb-2">
        <button id="prev-month" class="btn btn-outline-primary">&laquo; Poprzedni</button>
        <h4 id="calendar-month"></h4>
        <button id="next-month" class="btn btn-outline-primary">Następny &raquo;</button>
    </div>

    <table class="table table-bordered text-center" id="calendar-table">
        <thead>
            <tr>
                <th>Pn</th>
                <th>Wt</th>
                <th>Śr</th>
                <th>Cz</th>
                <th>Pt</th>
                <th>Sb</th>
                <th>Nd</th>
            </tr>
        </thead>
        <tbody id="calendar-body"></tbody>
    </table>

    <form action="{% url 'book_visit' %}" method="post" id="booking-form" class="mt-4">
        {% csrf_token %}
        <div class="mb-3">
            <label for="day" class="form-label">Dzień</label>
            <input type="date" id="day" name="day" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="hour" class="form-label">Godzina</label>
            <select id="hour" name="hour" class="form-select" required></select>
        </div>
        <button type="submit" class="btn btn-success">Umów wizytę</button>
    </form>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {

    const events = {{ events|safe }};
    const available_hours = {{ available_hours|safe }};
    const dayInput = document.getElementById("day");
    const hourSelect = document.getElementById("hour");
    const monthTitle = document.getElementById("calendar-month");

    let currentMonth = new Date();

    // Minimalna data input (24h)
    const now = new Date();
    const minDT = new Date(now.getTime() + 24 * 60 * 60 * 1000);
    minDT.setMinutes(0, 0, 0);
    dayInput.min = minDT.toISOString().slice(0, 10);
    dayInput.value = dayInput.min;

    function populateHours(selectedDate) {
        hourSelect.innerHTML = "";

        const placeholder = document.createElement("option");
        placeholder.textContent = "-- wybierz godzinę --";
        placeholder.disabled = true;
        placeholder.selected = true;
        hourSelect.appendChild(placeholder);

        const hours = available_hours[selectedDate] || [];

        if (hours.length === 0) {
            const opt = document.createElement("option");
            opt.textContent = "Brak dostępnych godzin";
            opt.disabled = true;
            hourSelect.appendChild(opt);
            return;
        }

        hours.forEach(hObj => {
            const opt = document.createElement("option");
            opt.value = hObj.hour;
            opt.textContent = hObj.hour + ":00";

            if (!hObj.available) {
                opt.disabled = true;
                opt.style.color = "#999";
            }
            hourSelect.appendChild(opt);
        });
    }

    dayInput.addEventListener("change", () => populateHours(dayInput.value));

    function formatDateLocal(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, "0");
        const d = String(date.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
    }

    function renderCalendar(date) {
        const tbody = document.getElementById("calendar-body");
        tbody.innerHTML = "";

        const year = date.getFullYear();
        const month = date.getMonth();
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);

        const monthNames = [
            "Styczeń", "Luty", "Marzec", "Kwiecień", "Maj", "Czerwiec",
            "Lipiec", "Sierpień", "Wrzesień", "Październik", "Listopad", "Grudzień"
        ];
        monthTitle.textContent = `${monthNames[month]} ${year}`;

        let dayCounter = 1;
        const startIndex = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;

        for (let week = 0; week < 6; week++) {
            const tr = document.createElement("tr");

            for (let weekday = 0; weekday < 7; weekday++) {
                const td = document.createElement("td");

                if (week === 0 && weekday < startIndex) {
                    td.className = "empty-day";
                } else if (dayCounter <= lastDay.getDate()) {

                    const fullDate = formatDateLocal(new Date(year, month, dayCounter));

                    const dayDiv = document.createElement("div");
                    dayDiv.textContent = dayCounter;
                    dayDiv.className = "day-number";

                    td.appendChild(dayDiv);

                    const dayEvents = events.filter(e => e.start.slice(0, 10) === fullDate);

                    if (dayEvents.some(e => e.status === "zablokowana")) {
                        td.classList.add("blocked-day");
                    } else if (new Date(year, month, dayCounter).getDay() === 0 ||
                               new Date(year, month, dayCounter).getDay() === 6) {
                        td.classList.add("weekend-day");
                    }

                    dayEvents.forEach(ev => {
                        const div = document.createElement("div");
                        div.className = "visit-block";
                        div.textContent = ev.status === "zablokowana" ? "Zablokowany" : ev.title;
                        div.style.backgroundColor = ev.status === "zablokowana" ? "#808080" : "#0d6efd";
                        td.appendChild(div);
                    });

                    if (!td.classList.contains("blocked-day") &&
                        !td.classList.contains("weekend-day")) {

                        td.addEventListener("click", () => {
                            document.querySelectorAll("#calendar-table td")
                                .forEach(cell => cell.classList.remove("selected-day"));

                            td.classList.add("selected-day");
                            dayInput.value = fullDate;
                            populateHours(fullDate);
                        });
                    }

                    dayCounter++;

                } else {
                    td.className = "empty-day";
                }

                tr.appendChild(td);
            }

            tbody.appendChild(tr);
        }
    }

    document.getElementById("prev-month")
        .addEventListener("click", () => {
            currentMonth.setMonth(currentMonth.getMonth() - 1);
            renderCalendar(currentMonth);
        });

    document.getElementById("next-month")
        .addEventListener("click", () => {
            currentMonth.setMonth(currentMonth.getMonth() + 1);
            renderCalendar(currentMonth);
        });

    renderCalendar(currentMonth);
    populateHours(dayInput.value);
});
</script>
{% endblock %}

{% block extra_js %}{% endblock %}
