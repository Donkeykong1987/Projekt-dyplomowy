{% extends "admin/base_site.html" %}

{% block content %}
<h1>🔒 Blokowanie zakresu dat</h1>

<form method="post" style="max-width: 400px;">
    {% csrf_token %}
    <fieldset class="module aligned">
        {{ form.as_p }}
    </fieldset>

    <div class="submit-row">
        <input type="submit" value="Zablokuj zakres" class="default">
        <a href="../" class="button cancel-link">Anuluj</a>
    </div>
</form>

{% endblock %}
